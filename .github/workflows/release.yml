name: Release

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  package:
    name: Build, attest, and publish release artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Build release tarball
        run: npm pack

      - name: Attest release tarball provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: "*.tgz"

      - name: Upload tarball to GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" *.tgz --clobber

      - name: Publish package to npm with provenance
        if: github.event_name == 'release' && vars.NPM_PUBLISH == 'true'
        run: npm publish *.tgz --provenance --access public
